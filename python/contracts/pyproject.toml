[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labelit-contracts"
version = "0.1.0"
description = "Pydantic models corresponding to @labelit/contracts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labelit_contracts"]
